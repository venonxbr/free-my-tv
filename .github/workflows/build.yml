name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Build Tools e Plataforma
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Compilar Free My TV
        run: |
          # Adicionar ferramentas do Android SDK ao PATH
          export PATH=$ANDROID_HOME/build-tools/34.0.0:$PATH
          
          # Criar ficheiro de configuracao base
          if [ -f config.example.properties ]; then
            cp config.example.properties config.properties
          fi
          
          # Dar permissao e executar o script de compilacao
          chmod +x build.sh
          ./build.sh

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Instalador
          path: FreeMyTV.apk
