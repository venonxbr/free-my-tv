name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceitar licencas e configurar variaveis
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Compilar Free My TV
        run: |
          export PATH=$ANDROID_HOME/build-tools/34.0.0:$PATH
          
          if [ -f config.example.properties ]; then
            cp config.example.properties config.properties
          fi
          
          chmod +x build.sh
          ./build.sh

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-Instalador
          path: FreeMyTV.apk
